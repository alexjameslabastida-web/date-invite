<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Important Question 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Subtle Floating Background Decor */
        .heart-bg {
            position: fixed;
            color: rgba(255, 255, 255, 0.45);
            font-size: 24px;
            animation: floatUp 8s infinite linear;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Container Card */
        .container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(255, 71, 87, 0.2), 0 0 20px rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.9);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .heart-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: inline-block;
            animation: floatHeart 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .aesthetic-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.2);
            border: 3px solid #fff;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff3355;
            font-size: 21px;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.35;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 60px;
            margin-top: 15px;
            padding: 0 10px;
        }

        button, .submit-btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            outline: none;
        }

        #yesBtn {
            background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #yesBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 22px rgba(46, 213, 115, 0.5);
        }

        #noBtn {
            background: linear-gradient(135deg, #ff4757 0%, #ff2e44 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
            transition: left 0.12s ease-out, top 0.12s ease-out;
            z-index: 9999;
            position: relative;
        }

        .step-view {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            text-align: left;
        }

        label {
            font-weight: 700;
            color: #555;
            font-size: 13px;
            margin-left: 4px;
        }

        select, input[type="date"], input[type="time"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 15px;
            border: 2px solid #ffccd5;
            background: #fff;
            font-size: 15px;
            outline: none;
            color: #333;
            box-sizing: border-box;
            font-family: inherit;
        }

        select:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.2);
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff4757 0%, #ff2e44 100%);
            color: white;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        #successMessage {
            font-size: 18px;
            color: #2ed573;
            font-weight: 700;
            margin-top: 15px;
            line-height: 1.4;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        :root {
            --rose: #d85b7a;
            --deep-rose: #9f3154;
            --blush: #fff2f5;
            --cream: #fffaf7;
            --sage: #9bb39a;
            --ink: #4b3540;
        }

        html, body {
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 12% 12%, rgba(255,255,255,.75) 0 70px, transparent 71px),
                radial-gradient(circle at 88% 18%, rgba(255,220,231,.72) 0 110px, transparent 111px),
                radial-gradient(circle at 18% 90%, rgba(255,241,219,.65) 0 100px, transparent 101px),
                linear-gradient(135deg, #f7d7df 0%, #fff7f2 48%, #ead8df 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .32;
            background-image:
                radial-gradient(rgba(120,70,90,.13) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
            background-size: 22px 22px, 31px 31px;
            background-position: 0 0, 11px 8px;
            z-index: 0;
        }

        .container {
            max-width: 455px;
            width: min(92%, 455px);
            padding: 24px 25px 28px;
            background: linear-gradient(145deg, rgba(255,255,255,.91), rgba(255,247,249,.82));
            border: 1px solid rgba(255,255,255,.95);
            box-shadow:
                0 28px 70px rgba(120, 56, 79, .18),
                0 8px 24px rgba(255, 255, 255, .8),
                inset 0 1px 0 rgba(255,255,255,.95);
        }

        .container::before,
        .container::after {
            position: absolute;
            font-size: 28px;
            opacity: .72;
            pointer-events: none;
        }

        .container::before {
            content: "🌷";
            left: -18px;
            top: -19px;
            transform: rotate(-18deg);
        }

        .container::after {
            content: "🌸";
            right: -16px;
            bottom: -18px;
            transform: rotate(17deg);
        }

        .corner-decoration {
            position: absolute;
            pointer-events: none;
            font-size: 25px;
            opacity: .65;
            filter: drop-shadow(0 3px 5px rgba(120,50,70,.12));
        }

        .corner-decoration.one { top: 8px; left: 10px; }
        .corner-decoration.two { top: 7px; right: 11px; }

        .eyebrow {
            margin: -2px 0 3px;
            color: #a15a70;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
        }

        .hero-photo {
            width: 100%;
            height: 165px;
            object-fit: cover;
            object-position: center;
            border-radius: 20px;
            margin: 2px 0 17px;
            border: 5px solid rgba(255,255,255,.9);
            box-shadow: 0 12px 30px rgba(125,57,80,.18);
            filter: saturate(.9) contrast(.98);
        }

        .photo-frame {
            position: relative;
        }

        .photo-frame::after {
            content: "♡";
            position: absolute;
            right: 15px;
            bottom: 10px;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255,255,255,.82);
            color: var(--rose);
            font-family: Georgia, serif;
            font-size: 22px;
            box-shadow: 0 5px 14px rgba(80,40,60,.12);
        }

        .heart-icon {
            font-size: 43px;
            margin: 2px 0 0;
            filter: drop-shadow(0 6px 9px rgba(210,70,105,.15));
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--deep-rose);
            font-size: 31px;
            line-height: 1.08;
            margin: 5px 8px 18px;
            font-weight: 700;
            letter-spacing: -.015em;
        }

        .btn-container {
            height: 62px;
            margin-top: 12px;
            padding: 0 8px;
        }

        button, .submit-btn {
            font-family: 'DM Sans', sans-serif;
            letter-spacing: .01em;
        }

        #yesBtn, #noBtn {
            min-width: 132px;
            padding: 13px 23px;
        }

        #yesBtn {
            background: linear-gradient(135deg, #c96a86, #a94666);
            box-shadow: 0 8px 22px rgba(169,70,102,.24);
        }

        #yesBtn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 11px 26px rgba(169,70,102,.30);
        }

        #noBtn {
            background: linear-gradient(135deg, #9b8790, #77656f);
            box-shadow: 0 8px 20px rgba(90,65,75,.22);
        }

        .divider {
            width: 80px;
            height: 1px;
            margin: 0 auto 13px;
            background: linear-gradient(90deg, transparent, #dca0b1, transparent);
        }

        .form-card-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 26px;
            color: var(--deep-rose);
            margin: 0 0 12px;
        }

        .aesthetic-img {
            height: 175px;
            border-radius: 20px;
            border: 5px solid rgba(255,255,255,.95);
            box-shadow: 0 12px 30px rgba(125,57,80,.18);
        }

        label {
            color: #6c4e5a;
            font-size: 12px;
            letter-spacing: .02em;
        }

        select, input[type="date"], input[type="time"] {
            border: 1px solid #e7c5cf;
            background: rgba(255,255,255,.88);
            box-shadow: inset 0 1px 2px rgba(80,40,60,.03);
        }

        select:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: #c96a86;
            box-shadow: 0 0 0 4px rgba(201,106,134,.10);
        }

        .submit-btn {
            background: linear-gradient(135deg, #c96a86, #a94666);
            box-shadow: 0 8px 22px rgba(169,70,102,.24);
        }

        .floating-petal {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            font-size: 19px;
            opacity: .5;
            animation: petalDrift 11s linear infinite;
        }

        @keyframes petalDrift {
            0% { transform: translate3d(0, 110vh, 0) rotate(0deg); opacity: 0; }
            12% { opacity: .55; }
            50% { transform: translate3d(35px, 48vh, 0) rotate(160deg); }
            100% { transform: translate3d(-35px, -12vh, 0) rotate(320deg); opacity: 0; }
        }

        .sparkle {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            color: rgba(255,255,255,.82);
            font-size: 15px;
            animation: sparklePulse 2.8s ease-in-out infinite;
        }

        @keyframes sparklePulse {
            0%,100% { transform: scale(.7); opacity: .2; }
            50% { transform: scale(1.15); opacity: .9; }
        }

        @media (max-width: 520px) {
            .container {
                padding: 20px 18px 24px;
            }
            .hero-photo, .aesthetic-img {
                height: 145px;
            }
            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <!-- Background Decor -->
    <div class="heart-bg" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="heart-bg" style="left: 45%; animation-delay: 3s;">🌸</div>
    <div class="heart-bg" style="left: 80%; animation-delay: 1.5s;">✨</div>
    <div class="floating-petal" style="left: 8%; animation-delay: 1s;">🌸</div>
    <div class="floating-petal" style="left: 68%; animation-delay: 5s;">🌷</div>
    <div class="floating-petal" style="left: 90%; animation-delay: 8s;">🌸</div>
    <div class="sparkle" style="left: 17%; top: 19%; animation-delay: .2s;">✦</div>
    <div class="sparkle" style="right: 15%; top: 27%; animation-delay: 1.1s;">✧</div>
    <div class="sparkle" style="right: 23%; bottom: 16%; animation-delay: 1.8s;">✦</div>

    <div class="container">
        <!-- Step 1: The Question -->
        <div id="step1" class="step-view">
            <div class="corner-decoration one">♡</div>
            <div class="corner-decoration two">✿</div>
            <div class="eyebrow">a little question from my heart</div>
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=900&auto=format&fit=crop"
                     alt="Romantic flowers and hearts" class="hero-photo">
            </div>
            <div class="heart-icon">💌</div>
            <div class="divider"></div>
            <h1>Hey... do you want to go on a date with me? 🥺</h1>
            <div class="btn-container">
                <button id="yesBtn" onclick="nextStep()">Yes! 🥰</button>
                <button id="noBtn">No 🙄</button>
            </div>
        </div>

        <!-- Step 2: Date Form -->
        <div id="step2" class="step-view hidden">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop" alt="Aesthetic Hearts" class="aesthetic-img">
            <div class="form-card-title">Yay! Best choice ever. ❤️</div><div class="divider"></div>
            <form id="dateForm" action="https://formspree.io/f/mgaeprvz" method="POST" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="place">Where should we go?</label>
                    <select id="place" name="Activity" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="Dinner Date 🍽️">🍽️ Dinner Date</option>
                        <option value="Movie Date 🎬">🎬 Movie Date</option>
                        <option value="Stroll / Walk 🌳">🌳 Stroll / Walk</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">What date?</label>
                    <input type="date" id="date" name="Date" required>
                </div>

                <div class="form-group">
                    <label for="time">What time?</label>
                    <input type="time" id="time" required>
                    <input type="hidden" id="formattedTime" name="Time">
                </div>

                <button type="submit" class="submit-btn">Confirm Date! ✨</button>
            </form>
        </div>

        <!-- Step 3: Success -->
        <div id="step3" class="step-view hidden">
            <div class="eyebrow">officially official 💌</div>
            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=700&auto=format&fit=crop" alt="Romantic flowers" class="aesthetic-img">
            <div class="heart-icon">💗</div>
            <h1>It's a date! ✨</h1>
            <p id="successMessage">Your response has been sent! Can't wait! ❤️</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        let isFixed = false;
        let lastDodge = 0;

        /*
         * The "No" button is a tease: whenever the cursor gets close,
         * it immediately jumps somewhere else. It never becomes clickable.
         */
        function handlePointerMove(e) {
            if (document.getElementById('step1').classList.contains('hidden')) return;

            const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
            const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);

            if (clientX == null || clientY == null) return;

            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            const distance = Math.hypot(
                clientX - btnCenterX,
                clientY - btnCenterY
            );

            // Start dodging before the cursor can reach the button.
            const triggerDistance = 130;

            if (distance < triggerDistance) {
                dodgeNoButton(clientX, clientY);
            }
        }

        window.addEventListener('mousemove', handlePointerMove, { passive: true });
        window.addEventListener('touchmove', handlePointerMove, { passive: true });

        // Also dodge if the pointer somehow gets onto the button.
        noBtn.addEventListener('mouseenter', () => {
            dodgeNoButton(
                window.innerWidth / 2,
                window.innerHeight / 2
            );
        });

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNoButton(
                e.touches[0]?.clientX ?? window.innerWidth / 2,
                e.touches[0]?.clientY ?? window.innerHeight / 2
            );
        }, { passive: false });

        // Extra safety: clicking No simply makes it run away.
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dodgeNoButton(
                window.innerWidth / 2,
                window.innerHeight / 2
            );
        });

        function dodgeNoButton(cursorX, cursorY) {
            const now = performance.now();

            // Prevent multiple mousemove events from fighting each other.
            if (now - lastDodge < 80) return;
            lastDodge = now;

            const rect = noBtn.getBoundingClientRect();

            if (!isFixed) {
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${rect.left}px`;
                noBtn.style.top = `${rect.top}px`;
                isFixed = true;
            }

            const btnWidth = rect.width;
            const btnHeight = rect.height;
            const padding = 20;

            const minX = padding;
            const maxX = Math.max(minX, window.innerWidth - btnWidth - padding);
            const minY = padding;
            const maxY = Math.max(minY, window.innerHeight - btnHeight - padding);

            // Pick a location that is far away from the cursor.
            const candidates = [];
            for (let i = 0; i < 25; i++) {
                const x = minX + Math.random() * (maxX - minX);
                const y = minY + Math.random() * (maxY - minY);
                const centerX = x + btnWidth / 2;
                const centerY = y + btnHeight / 2;
                const distance = Math.hypot(centerX - cursorX, centerY - cursorY);

                candidates.push({ x, y, distance });
            }

            // Prefer the candidate farthest from the cursor.
            candidates.sort((a, b) => b.distance - a.distance);
            const target = candidates[0];

            noBtn.style.left = `${target.x}px`;
            noBtn.style.top = `${target.y}px`;
        }

        function nextStep() {
            triggerConfetti();
            document.getElementById('step1').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('step2').classList.remove('hidden');
            }, 250);
        }

        function formatTimeToAMPM(timeValue) {
            if (!timeValue) return '';
            const [hours, minutes] = timeValue.split(':');
            let h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${minutes} ${ampm}`;
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;

            const rawTime = document.getElementById('time').value;
            document.getElementById('formattedTime').value = formatTimeToAMPM(rawTime);

            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    triggerConfetti();
                    document.getElementById('step2').classList.add('hidden');
                    setTimeout(() => {
                        document.getElementById('step3').classList.remove('hidden');
                    }, 250);
                } else {
                    alert("Oops! There was a problem submitting your response.");
                }
            } catch (error) {
                alert("Oops! There was a problem submitting your response.");
            }
        }

        /* Light Confetti Engine */
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            const colors = ['#ff4757', '#ff6b81', '#70a1ff', '#2ed573'];
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 2,
                    size: Math.random() * 10 + 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1
                });
            }
            animateConfetti();
        }

        let animating = false;
        function animateConfetti() {
            if (animating) return;
            animating = true;

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= 0.02;

                    ctx.save();
                    ctx.globalAlpha = Math.max(p.alpha, 0);
                    ctx.fillStyle = p.color;
                    ctx.font = `${p.size}px serif`;
                    ctx.fillText('💖', p.x, p.y);
                    ctx.restore();

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    }
                });

                if (particles.length > 0) {
                    requestAnimationFrame(loop);
                } else {
                    animating = false;
                }
            }
            loop();
        }
    </script>

</body>
</html>
