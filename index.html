<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Important Question 💌</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button, .submit-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #yesBtn {
            background-color: #2ed573;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #ff4757;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .hidden {
            display: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        select, input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        select:focus, input[type="datetime-local"]:focus {
            border-color: #ff4757;
        }

        .submit-btn {
            background-color: #ff4757;
            color: white;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background-color: #ff2e44;
        }

        #successMessage {
            font-size: 20px;
            color: #2ed573;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Step 1: The Question -->
        <div id="step1">
            <h1>Hey... do you want to go on a date with me? 🥺</h1>
            <div class="btn-container">
                <button id="yesBtn" onclick="nextStep()">Yes! 🥰</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 🙄</button>
            </div>
        </div>

        <!-- Step 2: Pick a Place & Date -->
        <div id="step2" class="hidden">
            <h1>Yay! Best choice ever. 🎉</h1>
            <form id="dateForm" action="https://formspree.io/f/mgaeprvz" method="POST" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="place">Where should we go?</label>
                    <select id="place" name="Activity" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="Dinner Date 🍽️">🍽️ Dinner Date</option>
                        <option value="Movie Date 🎬">🎬 Movie Date</option>
                        <option value="Stroll / Walk 🌳">🌳 Stroll / Walk</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="datetime">When are you free?</label>
                    <input type="datetime-local" id="datetime" name="Date_and_Time" required>
                </div>

                <button type="submit" class="submit-btn">Confirm Date! ✨</button>
            </form>
        </div>

        <!-- Step 3: Final confirmation -->
        <div id="step3" class="hidden">
            <h1>It's a date! ✨</h1>
            <p id="successMessage">Your response has been sent! Can't wait! ❤️</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function nextStep() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                } else {
                    alert("Oops! There was a problem submitting your response.");
                }
            } catch (error) {
                alert("Oops! There was a problem submitting your response.");
            }
        }
    </script>

</body>
</html>
